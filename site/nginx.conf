server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Derrière le proxy HTTPS de Dokploy : redirections relatives
    # (/projet-cpp/schema → /projet-cpp/schema/ sans http:// ni port interne).
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /projet-cpp { return 301 /projet-cpp/schema/; }
    location = /projet-cpp/ { return 301 /projet-cpp/schema/; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
